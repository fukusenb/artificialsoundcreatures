<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Artificial Sound Creatures - 合唱シミュレーター</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --line:#30363d; --txt:#c9d1d9; --accent:#4fd1c5; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--txt);
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
  }
  header { padding:12px 18px; border-bottom:1px solid var(--line); }
  header h1 { font-size:16px; margin:0; }
  header p { margin:4px 0 0; font-size:12px; color:#8b949e; }
  .wrap { display:flex; gap:16px; padding:16px; align-items:flex-start; flex-wrap:wrap; }
  .stage { display:flex; flex-direction:column; gap:8px; }
  canvas { background:#0d1117; border:1px solid var(--line); border-radius:8px; touch-action:none; }
  #field { cursor:grab; }
  .panel {
    background:var(--panel); border:1px solid var(--line); border-radius:8px;
    padding:14px; width:300px;
  }
  .panel h2 { font-size:13px; margin:0 0 10px; color:#e6edf3; }
  .row { margin:10px 0; }
  .row label { display:flex; justify-content:space-between; font-size:12px; margin-bottom:4px; }
  .row label .v { color:var(--accent); }
  input[type=range] { width:100%; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 12px; }
  button, select {
    background:#21262d; color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer;
  }
  button:hover { border-color:var(--accent); }
  .metric { font-size:28px; font-weight:700; color:var(--accent); }
  .metric small { font-size:12px; color:#8b949e; font-weight:400; }
  .chk { display:flex; align-items:center; gap:6px; font-size:12px; margin:6px 0; }
  .hint { font-size:11px; color:#8b949e; line-height:1.5; }
  #inspector { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
  .sep { border-top:1px solid var(--line); margin:12px 0; }
</style>
</head>
<body>
<header>
  <h1>Artificial Sound Creatures — 合唱シミュレーター</h1>
  <p>個体をドラッグで移動 / 環境音を配置 / 逆相同期(交互鳴き)の自己組織化を観察</p>
</header>

<div class="wrap">
  <div class="stage">
    <canvas id="field"></canvas>
    <canvas id="raster"></canvas>
    <div class="hint">
      操作: 個体・環境音を<b>ドラッグ</b>して移動。クリックで選択、<b>Delete/Backspace</b>で削除。<br>
      リンクの色 = 最近傍ペアの逆相度(緑=逆相に近い / 赤=同相)。輪の広がり = 発声。
    </div>
  </div>

  <div class="panel">
    <h2>操作</h2>
    <div class="btns">
      <button id="btnPlay">⏸ 一時停止</button>
      <button id="btnReset">位相リセット</button>
    </div>
    <div class="btns">
      <button id="btnAddFrog">＋ 個体</button>
      <button id="btnAddNoise">＋ 環境音</button>
      <button id="btnDelete">選択を削除</button>
      <button id="btnClearNoise">環境音全消し</button>
    </div>

    <div class="sep"></div>
    <h2>逆相スコア <small>(最近傍ペア平均)</small></h2>
    <div class="metric" id="metric">—</div>
    <div class="hint">100% = 完全な交互鳴き(位相差π) / 0% = 同時に鳴く</div>

    <div class="sep"></div>
    <h2>振動子パラメータ</h2>
    <div class="row"><label>結合強度 K <span class="v" id="KVal"></span></label>
      <input type="range" id="K" min="0" max="1" step="0.01" value="0.4"></div>
    <div class="row"><label>固有周期 T <span class="v" id="TVal"></span></label>
      <input type="range" id="T" min="0.5" max="3" step="0.05" value="1.0"></div>
    <div class="row"><label>周期の個体差 <span class="v" id="spreadVal"></span></label>
      <input type="range" id="spread" min="0" max="0.15" step="0.005" value="0.05"></div>
    <div class="row"><label>近傍音量ゲート <span class="v" id="gateVal"></span></label>
      <input type="range" id="gate" min="0" max="0.6" step="0.01" value="0.15"></div>
    <div class="row"><label>基準距離 d0 <span class="v" id="refdistVal"></span></label>
      <input type="range" id="refdist" min="60" max="240" step="5" value="120"></div>
    <div class="row"><label>検出遅延 <span class="v" id="latencyVal"></span></label>
      <input type="range" id="latency" min="0" max="0.4" step="0.01" value="0.1"></div>
    <div class="row"><label>環境音マスキング <span class="v" id="noisemaskVal"></span></label>
      <input type="range" id="noisemask" min="0" max="1" step="0.05" value="0.8"></div>
    <div class="row"><label>再生速度 <span class="v" id="speedVal"></span></label>
      <input type="range" id="speed" min="0.25" max="4" step="0.25" value="1"></div>

    <div class="row"><label>結合モード</label>
      <select id="mode">
        <option value="prc">PRC(徐々に寄せる)</option>
        <option value="schedule">Schedule(+T/2で予約・最近傍1体)</option>
      </select>
    </div>
    <label class="chk"><input type="checkbox" id="latcomp" checked> 検出遅延を補正</label>
    <label class="chk"><input type="checkbox" id="showlinks" checked> 最近傍リンクを表示</label>
    <label class="chk"><input type="checkbox" id="sound"> 音を鳴らす(WebAudio)</label>

    <div id="inspector">
      <h2>選択中の環境音</h2>
      <div class="row"><label>音量 level</label>
        <input type="range" id="nzLevel" min="0" max="1.5" step="0.05" value="0.6"></div>
      <div class="row"><label>影響半径 radius</label>
        <input type="range" id="nzRadius" min="30" max="250" step="5" value="110"></div>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
